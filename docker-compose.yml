services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutrigraph-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount direktori data agar ChromaDB & cache persist di host
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nutrigraph-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000/api/v1/analyze
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
